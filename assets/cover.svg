<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- Document Icon -->
  <g transform="translate(150, 80)">
    <!-- Document Background -->
    <rect x="0" y="0" width="100" height="120" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Document Lines -->
    <line x1="15" y1="30" x2="85" y2="30" stroke="#2196F3" stroke-width="3" stroke-linecap="round"/>
    <line x1="15" y1="50" x2="85" y2="50" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="15" y1="65" x2="85" y2="65" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="15" y1="80" x2="85" y2="80" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="15" y1="95" x2="70" y2="95" stroke="#2196F3" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  
  <!-- PDF Icon Badge -->
  <circle cx="320" cy="100" r="35" fill="#FF5252" opacity="0.95"/>
  <text x="320" y="110" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
  
  <!-- Title -->
  <text x="200" y="250" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">PDF Fácil</text>
  
  <!-- Subtitle -->
  <text x="200" y="280" font-family="Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)" text-anchor="middle">Crie e compartilhe PDFs com facilidade</text>
</svg>
